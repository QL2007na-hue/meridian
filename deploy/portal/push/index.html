<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<title>下发 · Meridian</title>
<style>
  :root{
    --canvas:#08090B; --ink:#F4F1EC; --ink-2:#A9A39B; --ink-3:#6F6A63; --ink-4:#46433F;
    --ember:#E0A662; --hairline:rgba(255,255,255,.075); --hairline-2:rgba(255,255,255,.15);
    --card:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.028));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--canvas);color:var(--ink)}
  body{
    font-family:-apple-system,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;justify-content:center;padding:32px 16px 56px;
    background:
      radial-gradient(90% 60% at 20% 0%, rgba(224,166,98,.06), transparent 62%),
      var(--canvas);
  }
  .wrap{width:100%;max-width:460px}
  .caps{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
  .back{font-size:12px;color:var(--ink-3);text-decoration:none;letter-spacing:.06em}
  .back:hover{color:var(--ink-2)}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
  h1{font-size:28px;font-weight:300;letter-spacing:-.02em;margin-top:10px}
  .card{
    background:var(--card);border:1px solid var(--hairline);border-radius:18px;padding:20px;
    position:relative;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.35);
  }
  .card::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;
    background:linear-gradient(180deg,rgba(255,255,255,.10),transparent)}
  label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);margin:16px 0 7px}
  label:first-of-type{margin-top:0}
  input,select,textarea{
    width:100%;min-height:46px;padding:0 14px;border-radius:11px;
    background:rgba(255,255,255,.045);border:1px solid var(--hairline);color:var(--ink);
    font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:rgba(224,166,98,.55);background:rgba(255,255,255,.06);
  }
  input::placeholder{color:var(--ink-4)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{
    min-height:42px;border-radius:10px;border:1px solid var(--hairline);background:rgba(255,255,255,.028);
    color:var(--ink-3);font-size:13px;font-family:inherit;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:6px;transition:background .2s,border-color .2s,color .2s;
  }
  .chip .n{font-size:10px;letter-spacing:.14em;color:var(--ink-4);font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:rgba(224,166,98,.10);border-color:rgba(224,166,98,.45);color:var(--ink)}
  .chip[aria-pressed="true"] .n{color:var(--ember)}
  .submit{
    width:100%;min-height:50px;margin-top:20px;border:0;border-radius:999px;cursor:pointer;
    background:var(--ember);color:#14100A;font-size:15px;font-weight:600;font-family:inherit;
    letter-spacing:.02em;transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .18s;
  }
  .submit:hover{opacity:.93}
  .submit:active{transform:scale(.98)}
  .submit:disabled{opacity:.5;cursor:default}
  .msg{margin-top:14px;font-size:13px;line-height:1.6;min-height:20px;color:var(--ink-2)}
  .msg.ok{color:var(--ember)}
  .msg.err{color:#E8836F}
  .recent{margin-top:22px}
  .recent h2{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
  .list{list-style:none;display:flex;flex-direction:column}
  .list li{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--hairline);font-size:14px}
  .list li:last-child{border-bottom:0}
  .list .t{flex:1;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list .d{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
  footer{margin-top:28px;font-size:11px;color:var(--ink-4);letter-spacing:.08em}
  @media (prefers-reduced-motion:reduce){ .submit,.chip{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="caps">Meridian · 下发</div>
      <h1>推一条到 iPad</h1>
    </div>
    <a class="back" href="../">‹ 门户</a>
  </header>

  <div class="card">
    <label>通道</label>
    <div class="chips" id="chips">
      <button class="chip" data-ch="01" aria-pressed="false"><span class="n">01</span>日常</button>
      <button class="chip" data-ch="02" aria-pressed="false"><span class="n">02</span>工作</button>
      <button class="chip" data-ch="03" aria-pressed="false"><span class="n">03</span>学习</button>
      <button class="chip" data-ch="04" aria-pressed="false"><span class="n">04</span>生活</button>
      <button class="chip" data-ch="05" aria-pressed="false"><span class="n">05</span>提醒</button>
      <button class="chip" data-ch="06" aria-pressed="false"><span class="n">06</span>临时</button>
    </div>

    <label for="title">要做什么</label>
    <input id="title" type="text" placeholder="例如：把样机寄给客户" autocomplete="off" enterkeyhint="done">

    <div class="row">
      <div>
        <label for="day">日期</label>
        <input id="day" type="date">
      </div>
      <div>
        <label for="time">时间</label>
        <input id="time" type="time" step="300">
      </div>
    </div>

    <label for="prio">优先级</label>
    <select id="prio">
      <option value="0">普通</option>
      <option value="1">重要</option>
      <option value="2">紧急</option>
    </select>

    <label for="token">口令（服务器 MERIDIAN_TOKEN，仅存本机）</label>
    <input id="token" type="password" placeholder="粘贴一次即可" autocomplete="off">

    <button class="submit" id="send">下发</button>
    <div class="msg" id="msg"></div>
  </div>

  <section class="recent">
    <h2>今天最近</h2>
    <ul class="list" id="recent"><li><span class="t" style="color:var(--ink-4)">输入口令后显示</span></li></ul>
  </section>

  <footer>MERIDIAN · 子午时钟 · <span id="hostfoot">本机</span></footer>
</div>

<script>
(function () {
  var API = '../api';
  var store = window.localStorage;
  var tokenInput = document.getElementById('token');
  var titleInput = document.getElementById('title');
  var dayInput = document.getElementById('day');
  var timeInput = document.getElementById('time');
  var prioInput = document.getElementById('prio');
  var msg = document.getElementById('msg');
  var send = document.getElementById('send');
  var chips = Array.prototype.slice.call(document.querySelectorAll('#chips .chip'));
  var selected = store.getItem('meridian.ch') || '01';

  function pad(n) { return String(n).padStart(2, '0'); }
  function todayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  function paintChips() {
    chips.forEach(function (c) { c.setAttribute('aria-pressed', String(c.dataset.ch === selected)); });
  }

  function applyChannel() {
    var pre = { '01': '0', '02': '1', '03': '0', '04': '0', '05': '2', '06': '1' };
    if (pre[selected]) prioInput.value = pre[selected];
    paintChips();
  }

  var foot = document.getElementById('hostfoot');
  if (foot) foot.textContent = location.host;

  var params = new URLSearchParams(location.search);
  var fromUrl = params.get('ch');
  if (fromUrl && /^\d{2}$/.test(fromUrl) && chips.some(function (c) { return c.dataset.ch === fromUrl; })) {
    selected = fromUrl;
  }
  store.setItem('meridian.ch', selected);
  paintChips();

  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      selected = c.dataset.ch;
      store.setItem('meridian.ch', selected);
      applyChannel();
    });
  });

  var saved = store.getItem('meridian.token');
  if (saved) tokenInput.value = saved;

  dayInput.value = todayKey(new Date());
  applyChannel();

  function auth() { return { 'Authorization': 'Bearer ' + tokenInput.value.trim(), 'Content-Type': 'application/json' }; }

  function say(text, kind) {
    msg.textContent = text;
    msg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function loadRecent() {
    var token = tokenInput.value.trim();
    if (!token) return;
    fetch(API + '/v1/tasks?day=' + encodeURIComponent(dayInput.value || todayKey(new Date())), {
      headers: { 'Authorization': 'Bearer ' + token }, cache: 'no-store'
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      var list = document.getElementById('recent');
      var tasks = (j.tasks || []).slice(-4).reverse();
      if (!tasks.length) {
        list.innerHTML = '<li><span class="t" style="color:var(--ink-4)">今天还没有任务</span></li>';
        return;
      }
      list.innerHTML = tasks.map(function (t) {
        var d = t.due ? new Date(t.due) : null;
        var tm = d ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : '';
        return '<li><span class="t">' + (t.isDone ? '✓ ' : '') + escapeHtml(t.title) + '</span><span class="d">' + tm + '</span></li>';
      }).join('');
    }).catch(function () {
      document.getElementById('recent').innerHTML = '<li><span class="t" style="color:#E8836F">读取失败（检查口令）</span></li>';
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function buildDue() {
    if (!timeInput.value) return null;
    var day = dayInput.value || todayKey(new Date());
    var parts = timeInput.value.split(':');
    var local = new Date(day + 'T' + pad(parts[0]) + ':' + pad(parts[1] || '00') + ':00');
    return isNaN(local.getTime()) ? null : local.toISOString();
  }

  send.addEventListener('click', function () {
    var title = titleInput.value.trim();
    var token = tokenInput.value.trim();
    if (!token) { say('先填口令', 'err'); tokenInput.focus(); return; }
    if (!title) { say('标题不能为空', 'err'); titleInput.focus(); return; }
    store.setItem('meridian.token', token);

    var body = { title: title, day: dayInput.value || todayKey(new Date()), priority: parseInt(prioInput.value, 10) || 0 };
    var due = buildDue();
    if (due) body.due = due;
    var ch = selected;
    body.note = '通道 ' + ch;

    send.disabled = true;
    say('下发中…');
    fetch(API + '/v1/tasks', { method: 'POST', headers: auth(), body: JSON.stringify(body) })
      .then(function (r) {
        if (r.status === 401) throw new Error('口令不对');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) {
        say('已下发 ' + ch + ' · ' + j.title, 'ok');
        titleInput.value = '';
        loadRecent();
      })
      .catch(function (e) { say('失败：' + e.message, 'err'); })
      .finally(function () { send.disabled = false; });
  });

  titleInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); send.click(); }
  });
  tokenInput.addEventListener('blur', function () {
    var t = tokenInput.value.trim();
    if (t) { store.setItem('meridian.token', t); loadRecent(); }
  });
  dayInput.addEventListener('change', loadRecent);

  if (saved) loadRecent();
})();
</script>
</body>
</html>
