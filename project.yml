# XcodeGen spec — the .xcodeproj is generated, never committed.
#
# Rationale: a 200-line YAML is reviewable and cannot drift from the sources on
# disk. CI runs `xcodegen generate` before building.
#
#   brew install xcodegen
#   xcodegen generate
#   open Meridian.xcodeproj
#
# The Info.plist is hand-written and referenced directly. Do NOT move it under
# XcodeGen's `info:` key: that key *generates* a plist and silently drops every
# key not restated under `info.properties` (this is how projects lose
# UILaunchScreen and end up letterboxed instead of full screen).

name: Meridian

options:
  bundleIdPrefix: app.meridian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  Meridian:
    type: application
    platform: iOS
    sources:
      - path: ios/Meridian
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: ios/Meridian/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: app.meridian.clock
        PRODUCT_NAME: Meridian
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # 1 = iPhone, 2 = iPad. The app is designed for iPad in landscape and
        # degrades to a single-column reading on iPhone.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        # Overridden to NO by the CI unsigned build.
        CODE_SIGNING_ALLOWED: YES
    scheme:
      testTargets: []
      gatherCoverageData: false
